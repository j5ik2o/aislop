name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]
  workflow_call:
    outputs:
      passed:
        description: Whether every CI job succeeded
        value: ${{ jobs.verify.outputs.passed }}
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to run CI against"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test-ubuntu-22:
    name: Build & test (ubuntu-latest, 22)
    uses: ./.github/workflows/ci-build-test.yml
    with:
      os: ubuntu-latest
      node-version: 22

  test-ubuntu-24:
    name: Build & test (ubuntu-latest, 24)
    uses: ./.github/workflows/ci-build-test.yml
    with:
      os: ubuntu-latest
      node-version: 24

  test-windows-22:
    name: Build & test (windows-latest, 22)
    uses: ./.github/workflows/ci-build-test.yml
    with:
      os: windows-latest
      node-version: 22

  test-windows-24:
    name: Build & test (windows-latest, 24)
    uses: ./.github/workflows/ci-build-test.yml
    with:
      os: windows-latest
      node-version: 24

  # Stable required-check names. Branch protection matches status checks by exact string, so
  # "Build & test (22)" and "Build & test (24)" must keep those names; we expose them as thin
  # gates over the OS/node matrix above. Adding a platform thus never renames a required check
  # (a renamed required check hangs as "Expected" and blocks every PR). The always() + explicit
  # result check is deliberate: a gate that merely skips on matrix failure counts as *passing*
  # in branch protection, which would let a red matrix merge.
  check:
    name: Build & test
    needs: [test-ubuntu-22, test-ubuntu-24, test-windows-22, test-windows-24]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Require the OS/node test matrix to pass
        env:
          RESULTS: >-
            ${{ needs.test-ubuntu-22.result }}
            ${{ needs.test-ubuntu-24.result }}
            ${{ needs.test-windows-22.result }}
            ${{ needs.test-windows-24.result }}
        run: |
          if [[ "$RESULTS" != "success success success success" ]]; then
            echo "Build & test results: $RESULTS"
            exit 1
          fi

  quality-gate:
    name: CI quality gate
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.0.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: aislop ci
        run: node dist/cli.js ci .

  dotnet-lint:
    name: C# lint integration
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.0.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install roslynator CLI
        run: dotnet tool install -g roslynator.dotnet.cli --version 0.12.0

      - name: Restore trusted C# fixture
        run: dotnet restore tests/fixtures/dotnet/sample-project/Sample.csproj --locked-mode

      - name: Build
        run: pnpm build

      - name: Scan sample C# project and assert dotnet diagnostics appear
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          node dist/cli.js scan tests/fixtures/dotnet/sample-project --json > scan.json || true
          cat scan.json
          grep -q '"dotnet/' scan.json

  verify:
    name: Verify CI results
    needs: [test-ubuntu-22, test-ubuntu-24, test-windows-22, test-windows-24, quality-gate, dotnet-lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.verify.outputs.passed }}
    steps:
      - name: Require each job to succeed
        id: verify
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            all(.["test-ubuntu-22"], .["test-ubuntu-24"], .["test-windows-22"], .["test-windows-24"];
                .result == "success" and .outputs.passed == "true")
            and all(.["quality-gate"], .["dotnet-lint"]; .result == "success")
          ' <<< "$RESULTS"
          echo "passed=true" >> "$GITHUB_OUTPUT"
