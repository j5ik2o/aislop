name: CI build and test
on:
  workflow_call:
    outputs:
      passed:
        description: Whether the runner reached its final step
        value: ${{ jobs.run.outputs.passed }}
    inputs:
      os:
        required: true
        type: string
      node-version:
        required: true
        type: number

permissions:
  contents: read

jobs:
  run:
    name: Run
    runs-on: ${{ inputs.os }}

    outputs:
      passed: ${{ steps.complete.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.0.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm vitest run

      - name: Record successful completion
        id: complete
        shell: bash
        run: echo "passed=true" >> "$GITHUB_OUTPUT"
