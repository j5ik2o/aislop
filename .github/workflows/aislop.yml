name: aislop

on:
  pull_request:
    branches-ignore: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_call:
    outputs:
      passed:
        description: Whether every aislop job succeeded
        value: ${{ jobs.verify.outputs.passed }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-smoke:
    name: Scan smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.0.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build local CLI
        run: pnpm build

      - run: node dist/cli.js scan .

  default-latest-json:
    name: Action smoke (default-latest-json)
    uses: ./.github/workflows/ci-action-smoke.yml
    with:
      case: default-latest-json

  explicit-latest-human:
    name: Action smoke (explicit-latest-human)
    uses: ./.github/workflows/ci-action-smoke.yml
    with:
      case: explicit-latest-human

  pinned-current-json:
    name: Action smoke (pinned-current-json)
    uses: ./.github/workflows/ci-action-smoke.yml
    with:
      case: pinned-current-json

  quality-gate:
    name: Smoke workflow quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.0.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build local CLI
        run: pnpm build

      - run: node dist/cli.js ci .

  verify:
    name: Verify aislop results
    needs: [default-latest-json, explicit-latest-human, pinned-current-json, scan-smoke, quality-gate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.verify.outputs.passed }}
    steps:
      - name: Require each job to succeed
        id: verify
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            all(.["default-latest-json"], .["explicit-latest-human"], .["pinned-current-json"];
                .result == "success" and .outputs.passed == "true")
            and all(.["scan-smoke"], .["quality-gate"]; .result == "success")
          ' <<< "$RESULTS"
          echo "passed=true" >> "$GITHUB_OUTPUT"
